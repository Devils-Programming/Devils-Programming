<svg width="100%" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#0b0f19" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- 3D Metallic Text Gradient -->
    <linearGradient id="metalText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="85%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Bevel & Stroke Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="998" height="258" x="1" y="1" rx="15" stroke="url(#neonCyan)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Subtle 3D Perspective Isometric Grid -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="220" x2="1000" y2="220" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="100" y1="180" x2="0" y2="260" />
    <line x1="300" y1="180" x2="200" y2="260" />
    <line x1="500" y1="180" x2="500" y2="260" />
    <line x1="700" y1="180" x2="800" y2="260" />
    <line x1="900" y1="180" x2="1000" y2="260" />
  </g>

  <!-- 3D Polyhedral Architect Insignia Emblem (Left) -->
  <g transform="translate(60, 45)" filter="url(#glow3D)">
    <!-- Outer Hex Prism Wireframe -->
    <polygon points="85,5 160,45 160,125 85,165 10,125 10,45" fill="#0B132B" stroke="#38BDF8" stroke-width="2.5" />
    <!-- Isometric Inner Cube Facets -->
    <polygon points="85,5 160,45 85,85 10,45" fill="#1E293B" fill-opacity="0.7" stroke="#818CF8" stroke-width="1.5" />
    <polygon points="10,45 85,85 85,165 10,125" fill="#0F172A" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1.5" />
    <polygon points="160,45 85,85 85,165 160,125" fill="#1E1B4B" fill-opacity="0.75" stroke="#C084FC" stroke-width="1.5" />
    <!-- Glowing Core Node -->
    <circle cx="85" cy="85" r="9" fill="#38BDF8" filter="url(#glow3D)" />
    <circle cx="85" cy="85" r="4" fill="#FFFFFF" />
  </g>

  <!-- Main Headline Typography: HARSH (3D Extruded Effect) -->
  <g transform="translate(260, 115)">
    <!-- 3D Shadow Layers for Extrusion -->
    <text x="0" y="4" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="64" fill="#030712" letter-spacing="4">HARSH</text>
    <text x="0" y="2" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="64" fill="#1E1B4B" letter-spacing="4">HARSH</text>
    <!-- Foreground Metallic Gradient Text -->
    <text x="0" y="0" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="64" fill="url(#metalText)" letter-spacing="4" filter="url(#subtleShadow)">HARSH</text>
    
    <!-- Title Pill / Credential -->
    <text x="245" y="-12" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#38BDF8" letter-spacing="2">SYS.ARCH // v2.6.0</text>
    <rect x="240" y="-28" width="165" height="22" rx="4" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" fill="#030712" fill-opacity="0.6" />
    <text x="250" y="-13" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#38BDF8" letter-spacing="1.5">● PRODUCTION GRADE</text>
  </g>

  <!-- Subtitle & Role Specification -->
  <g transform="translate(262, 160)">
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-weight="600" font-size="20" fill="#E2E8F0" letter-spacing="1">
      Principal Software Engineer <tspan fill="#38BDF8">•</tspan> Polyglot Systems Architect
    </text>
    <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8" letter-spacing="0.5">
      Distributed Microservices <tspan fill="#818CF8">|</tspan> Low-Latency Engines <tspan fill="#818CF8">|</tspan> Autonomous Agentic AI
    </text>
  </g>

  <!-- Status & SLA Badges (Bottom Right) -->
  <g transform="translate(262, 222)">
    <!-- Badge 1 -->
    <rect x="0" y="-16" width="135" height="22" rx="4" fill="#0F172A" stroke="#22C55E" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="12" cy="-5" r="4" fill="#22C55E" />
    <text x="24" y="-5" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="10" fill="#22C55E" letter-spacing="0.8">99.99% UPTIME</text>

    <!-- Badge 2 -->
    <rect x="145" y="-16" width="130" height="22" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
    <text x="156" y="-5" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="10" fill="#38BDF8" letter-spacing="0.8">SUB-50MS P99</text>

    <!-- Badge 3 -->
    <rect x="285" y="-16" width="150" height="22" rx="4" fill="#0F172A" stroke="#C084FC" stroke-width="1" stroke-opacity="0.6" />
    <text x="296" y="-5" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="10" fill="#C084FC" letter-spacing="0.8">THREE.JS LAB ACTIVE</text>
  </g>
</svg>
