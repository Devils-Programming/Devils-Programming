<svg width="100%" height="90" viewBox="0 0 1000 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="launcherBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="btnGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="1000" height="90" rx="12" fill="url(#launcherBg)" />
  <rect width="998" height="88" x="1" y="1" rx="11" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- 3D Polyhedron Mini Icon -->
  <g transform="translate(30, 22)">
    <polygon points="23,0 46,12 46,36 23,48 0,36 0,12" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <polygon points="23,0 46,12 23,24 0,12" fill="#38BDF8" fill-opacity="0.3" stroke="#818CF8" />
    <circle cx="23" cy="24" r="5" fill="#38BDF8" />
  </g>

  <!-- Title & Description -->
  <g transform="translate(95, 38)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-weight="800" font-size="18" fill="#F8FAFC" letter-spacing="1">
      ⚡ ENTER INTERACTIVE 3D WEBGL LAB
    </text>
    <text x="0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="13" fill="#94A3B8">
      Explore the real-time Three.js distributed cluster simulation with raymarched nodes and particle mesh.
    </text>
  </g>

  <!-- Glowing Action Pill Button (Right) -->
  <g transform="translate(760, 24)" filter="url(#btnGlow)">
    <rect width="210" height="42" rx="21" fill="#38BDF8" />
    <text x="105" y="26" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="13" fill="#030712" text-anchor="middle" letter-spacing="1.5">
      LAUNCH 3D SCENE ➔
    </text>
  </g>
</svg>
