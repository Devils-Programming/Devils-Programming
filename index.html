<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harsh | Systems Architect & Polyglot Engineer — 3D WebGL Telemetry Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HUD Overlay */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 14px 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #38BDF8, #C084FC);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: #030712;
      font-size: 18px;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #FFFFFF, #38BDF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94A3B8;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #4ADE80;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .status-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22C55E;
      box-shadow: 0 0 8px #22C55E;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-github {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #38BDF8;
      color: #030712;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    }

    .btn-github:hover {
      background: #7DD3FC;
      transform: translateY(-1px);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.6);
    }

    /* Floating Telemetry Tooltip */
    #node-tooltip {
      position: absolute;
      display: none;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid #38BDF8;
      border-radius: 8px;
      padding: 12px 18px;
      color: #F8FAFC;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      box-shadow: 0 8px 32px rgba(56, 189, 248, 0.3);
      pointer-events: none;
      z-index: 20;
    }

    #node-tooltip h4 {
      color: #38BDF8;
      font-size: 13px;
      margin-bottom: 4px;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
    }

    .control-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(192, 132, 252, 0.25);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      gap: 12px;
    }

    .hud-btn {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #E2E8F0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .hud-btn:hover, .hud-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38BDF8;
      color: #38BDF8;
    }

    .telemetry-specs {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 12px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94A3B8;
      text-align: right;
      line-height: 1.6;
    }

    .telemetry-specs span {
      color: #38BDF8;
      font-weight: 700;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .hud-layer { padding: 14px; }
      .header-bar { flex-direction: column; gap: 10px; align-items: flex-start; }
      .header-actions { width: 100%; justify-content: space-between; }
      .bottom-bar { flex-direction: column; align-items: stretch; }
      .control-panel { justify-content: center; }
      .telemetry-specs { text-align: center; }
    }
  </style>
</head>
<body>

  <!-- WebGL Render Canvas -->
  <div id="webgl-canvas"></div>

  <!-- Interactive HUD Layer -->
  <div class="hud-layer">
    <!-- Top Bar -->
    <header class="header-bar interactive">
      <div class="brand">
        <div class="brand-logo">H</div>
        <div class="brand-text">
          <h1>HARSH // SYSTEMS ARCHITECT</h1>
          <p>DISTRIBUTED CLUSTER 3D TOPOLOGY • WEBGL ENGINE</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="status-pill">
          <div class="status-pulse"></div>
          <span>P99 &lt; 50MS // LIVE</span>
        </div>
        <a class="btn-github" href="https://github.com/Devils-Programming" target="_blank">
          <span>GITHUB REPO</span> ➔
        </a>
      </div>
    </header>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <!-- Controls -->
      <div class="control-panel interactive">
        <button class="hud-btn active" id="btn-rotate">AUTO-ROTATE</button>
        <button class="hud-btn" id="btn-wireframe">WIREFRAME</button>
        <button class="hud-btn" id="btn-reset">RESET VIEW</button>
      </div>

      <!-- Live Engine Specs -->
      <div class="telemetry-specs">
        NODES: <span>6 ACTIVE MICROSERVICES</span> | FPS: <span id="fps-counter">60</span><br>
        STACK: <span>RUST • GO • KAFKA • PYTHON • CLICKHOUSE • TS</span>
      </div>
    </div>
  </div>

  <!-- Tooltip on Node Hover/Click -->
  <div id="node-tooltip">
    <h4 id="tooltip-title">Cluster Node</h4>
    <div id="tooltip-desc">Latency: 2ms • Status: Nominal</div>
  </div>

  <!-- CDN Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // --- Scene, Camera, Renderer ---
    const container = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030712, 0.002);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
    camera.position.set(0, 160, 320);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.1;
    controls.minDistance = 80;
    controls.maxDistance = 600;

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0x0f172a, 1.8);
    scene.add(ambientLight);

    const cyanPointLight = new THREE.PointLight(0x38bdf8, 3.5, 400);
    cyanPointLight.position.set(120, 100, 120);
    scene.add(cyanPointLight);

    const purplePointLight = new THREE.PointLight(0xc084fc, 3.5, 400);
    purplePointLight.position.set(-120, -60, -120);
    scene.add(purplePointLight);

    // --- 1. Central Core: Distributed Gateway Icosahedron ---
    const coreGroup = new THREE.Group();
    scene.add(coreGroup);

    // Inner glowing solid
    const innerCoreGeo = new THREE.IcosahedronGeometry(36, 1);
    const innerCoreMat = new THREE.MeshPhongMaterial({
      color: 0x0f172a,
      emissive: 0x1e1b4b,
      shininess: 90,
      flatShading: true
    });
    const innerCoreMesh = new THREE.Mesh(innerCoreGeo, innerCoreMat);
    coreGroup.add(innerCoreMesh);

    // Outer cyber wireframe
    const outerCoreGeo = new THREE.IcosahedronGeometry(42, 1);
    const outerCoreMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      wireframe: true,
      transparent: true,
      opacity: 0.85
    });
    const outerCoreMesh = new THREE.Mesh(outerCoreGeo, outerCoreMat);
    coreGroup.add(outerCoreMesh);

    // --- 2. Orbital Rings ---
    function createRing(radius, tiltX, tiltZ, color) {
      const ringGeo = new THREE.RingGeometry(radius - 0.6, radius + 0.6, 96);
      const ringMat = new THREE.MeshBasicMaterial({
        color: color,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.35
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = tiltX;
      ring.rotation.z = tiltZ;
      scene.add(ring);
      return ring;
    }

    const ring1 = createRing(110, Math.PI / 2.3, 0.3, 0x38bdf8);
    const ring2 = createRing(170, Math.PI / 2.8, -0.4, 0xc084fc);
    const ring3 = createRing(230, Math.PI / 2.1, 0.8, 0x22c55e);

    // --- 3. Satellite Microservice Nodes ---
    const nodeData = [
      { name: "Kafka Event Broker", stack: "Go / Kafka", throughput: "125k msg/s", latency: "2.4ms", color: 0x38bdf8, radius: 110, speed: 0.012, offset: 0 },
      { name: "Agentic AI Orchestrator", stack: "Python / FastAPI / LangGraph", throughput: "Deterministic Workflows", latency: "18ms", color: 0xc084fc, radius: 110, speed: 0.012, offset: Math.PI },
      { name: "Low-Latency OLAP Engine", stack: "Rust / ClickHouse", throughput: "50M row aggregations", latency: "12ms", color: 0x38bdf8, radius: 170, speed: 0.008, offset: 1.2 },
      { name: "Zero-Downtime Gateway", stack: "Envoy / gRPC", throughput: "Load-Balanced Proxy", latency: "0.8ms", color: 0x22c55e, radius: 170, speed: 0.008, offset: 4.2 },
      { name: "Distributed Storage Cache", stack: "Redis Cluster / Postgres", throughput: "99.98% Cache Hit Ratio", latency: "1.1ms", color: 0xfacc15, radius: 230, speed: 0.005, offset: 2.5 },
      { name: "Security & Observability Pod", stack: "OpenTelemetry / Vault", throughput: "Zero-Trust Encryption", latency: "Active", color: 0xc084fc, radius: 230, speed: 0.005, offset: 5.6 }
    ];

    const nodes = [];
    const interactiveMeshes = [];

    nodeData.forEach((info) => {
      const nodeGeo = new THREE.SphereGeometry(7, 24, 24);
      const nodeMat = new THREE.MeshStandardMaterial({
        color: info.color,
        emissive: info.color,
        emissiveIntensity: 0.6,
        roughness: 0.2
      });
      const nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);
      nodeMesh.userData = info;
      scene.add(nodeMesh);
      interactiveMeshes.push(nodeMesh);

      // Node aura
      const auraGeo = new THREE.SphereGeometry(10, 16, 16);
      const auraMat = new THREE.MeshBasicMaterial({
        color: info.color,
        wireframe: true,
        transparent: true,
        opacity: 0.4
      });
      const aura = new THREE.Mesh(auraGeo, auraMat);
      nodeMesh.add(aura);

      nodes.push({ mesh: nodeMesh, aura: aura, ...info });
    });

    // --- 4. Undulating Particle Matrix Grid (Floor) ---
    const particleCount = 2800;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleGridSize = 52;
    const spacing = 18;

    let idx = 0;
    for (let x = -particleGridSize / 2; x < particleGridSize / 2; x++) {
      for (let z = -particleGridSize / 2; z < particleGridSize / 2; z++) {
        particlePos[idx] = x * spacing;
        particlePos[idx + 1] = -110;
        particlePos[idx + 2] = z * spacing;
        idx += 3;
      }
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

    const particleMat = new THREE.PointsMaterial({
      color: 0x38bdf8,
      size: 2.2,
      transparent: true,
      opacity: 0.4
    });
    const particleMesh = new THREE.Points(particleGeo, particleMat);
    scene.add(particleMesh);

    // --- Raycasting & Hover Telemetry ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-999, -999);
    const tooltip = document.getElementById('node-tooltip');
    const tooltipTitle = document.getElementById('tooltip-title');
    const tooltipDesc = document.getElementById('tooltip-desc');

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      tooltip.style.left = (e.clientX + 16) + 'px';
      tooltip.style.top = (e.clientY + 16) + 'px';
    });

    // --- Controls and HUD Actions ---
    let autoRotate = true;
    const btnRotate = document.getElementById('btn-rotate');
    btnRotate.addEventListener('click', () => {
      autoRotate = !autoRotate;
      btnRotate.classList.toggle('active', autoRotate);
    });

    let wireframeMode = false;
    const btnWireframe = document.getElementById('btn-wireframe');
    btnWireframe.addEventListener('click', () => {
      wireframeMode = !wireframeMode;
      innerCoreMat.wireframe = wireframeMode;
      btnWireframe.classList.toggle('active', wireframeMode);
    });

    const btnReset = document.getElementById('btn-reset');
    btnReset.addEventListener('click', () => {
      camera.position.set(0, 160, 320);
      controls.target.set(0, 0, 0);
    });

    // FPS Counter
    let lastTime = performance.now();
    let frameCount = 0;
    const fpsElem = document.getElementById('fps-counter');

    // --- Animation Loop ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // FPS calculation
      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        fpsElem.textContent = frameCount;
        frameCount = 0;
        lastTime = now;
      }

      // Rotate core
      coreGroup.rotation.y = time * 0.25;
      coreGroup.rotation.x = Math.sin(time * 0.15) * 0.2;
      outerCoreMesh.rotation.y = -time * 0.35;

      // Orbit Satellite Nodes
      nodes.forEach((node) => {
        const angle = time * node.speed + node.offset;
        node.mesh.position.x = Math.cos(angle) * node.radius;
        node.mesh.position.z = Math.sin(angle) * node.radius;
        node.mesh.position.y = Math.sin(time * 1.5 + node.offset) * 12;
        node.aura.rotation.y = time * 0.8;
      });

      // Animate Undulating Floor Particles
      const pos = particleGeo.attributes.position.array;
      let pIdx = 1;
      for (let i = 0; i < particleCount; i++) {
        const px = pos[pIdx - 1];
        const pz = pos[pIdx + 1];
        pos[pIdx] = -110 + Math.sin(px * 0.015 + time * 1.2) * 9 + Math.cos(pz * 0.015 + time * 0.9) * 9;
        pIdx += 3;
      }
      particleGeo.attributes.position.needsUpdate = true;

      // Raycaster check
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        tooltip.style.display = 'block';
        tooltipTitle.textContent = hit.userData.name;
        tooltipTitle.style.color = '#' + hit.userData.color.toString(16).padStart(6, '0');
        tooltipDesc.innerHTML = `Stack: <b>${hit.userData.stack}</b><br>Metric: <b>${hit.userData.throughput}</b><br>Latency: <b>${hit.userData.latency}</b>`;
        document.body.style.cursor = 'pointer';
      } else {
        tooltip.style.display = 'none';
        document.body.style.cursor = 'default';
      }

      // Auto rotation
      if (autoRotate) {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
      } else {
        controls.autoRotate = false;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // --- Window Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
